[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aimuse"
version = "0.1.0"
description = "AI Muse core backend: taste-driven, consistent music generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "librosa>=0.10",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.6",
  "pyloudnorm>=0.1.1",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aimuse = "aimuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimuse = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
