name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests (offline, no API key)
        run: pytest -q
      - name: Smoke run with the fake engine (no API key, no cost)
        run: aimuse spike --engine fake --tracks 2 --out ../smoke-out
      - name: Report
        if: always()
        run: if [ -f ../smoke-out/report.md ]; then cat ../smoke-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fake-smoke-run
          path: smoke-out
          retention-days: 3
          if-no-files-found: ignore
