# Deploys the app (web, functions, rules) to your Firebase project. Manual only.
# One-time setup is described in docs/APP.md ("Deploy"). Needs:
#   secret   FIREBASE_SERVICE_ACCOUNT  JSON key of a deploy service account
#   secret   GEMINI_API_KEY            (already set) copied into Secret Manager when asked
#   variables FIREBASE_PROJECT_ID, FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN,
#             FIREBASE_STORAGE_BUCKET, FIREBASE_APP_ID   (web app config, not secret)
#             ALLOWED_EMAILS  comma-separated emails that may make songs (invite-only)
#             DAILY_USD       optional per-user daily cap (default 1.00)
name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      only:
        description: What to deploy
        type: choice
        options: ["hosting,functions,firestore,storage", "hosting", "functions", "firestore,storage"]
        default: "hosting,functions,firestore,storage"
      update_gemini_secret:
        description: Copy the GEMINI_API_KEY repo secret into Firebase Secret Manager first
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check configuration
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [ -n "$PROJECT" ] || missing+=(FIREBASE_PROJECT_ID)
          [ -n "$NEXT_PUBLIC_FIREBASE_API_KEY" ] || missing+=(FIREBASE_API_KEY)
          [ -n "$SA" ] || missing+=("FIREBASE_SERVICE_ACCOUNT (secret)")
          [ -n "${{ vars.ALLOWED_EMAILS }}" ] || missing+=(ALLOWED_EMAILS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing settings: ${missing[*]}. See docs/APP.md."
            exit 1
          fi
      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Prepare functions environment
        env:
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          DAILY_USD: ${{ vars.DAILY_USD }}
        run: |
          printf 'AIMUSE_ALLOWED_EMAILS=%s\nAIMUSE_DAILY_USD=%s\n' \
            "$ALLOWED_EMAILS" "${DAILY_USD:-1.00}" > functions/.env
          python -m venv functions/venv
          functions/venv/bin/pip install -q -r functions/requirements.txt
      - name: Update Gemini key in Secret Manager
        if: inputs.update_gemini_secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx --yes firebase-tools@15.34.1 functions:secrets:set \
            GEMINI_API_KEY --project "$PROJECT" --data-file=- --non-interactive
      - name: Deploy
        env:
          ONLY: ${{ inputs.only }}
        run: |
          npx --yes firebase-tools@15.34.1 deploy --project "$PROJECT" --only "$ONLY" \
            --non-interactive --force
