name: App CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "functions/**"
      - "backend/**"
      - "scripts/**"
      - "firebase.json"
      - "*.rules"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "functions/**"
      - "backend/**"
      - "scripts/**"
      - "firebase.json"
      - "*.rules"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (static export)
        run: npm run build

  functions:
    name: Functions unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            functions/requirements.txt
      - name: Install
        run: pip install -e backend -r functions/requirements.txt pytest ruff
      - name: Lint
        working-directory: functions
        run: ruff check . && ruff format --check .
      - name: Tests
        working-directory: functions
        run: pytest -q

  emulators:
    name: Security rules + end-to-end (emulators, fake engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            functions/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1
      - name: Install
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          pip install -e backend -r functions/requirements.txt pytest
      - name: Security rules + Firestore adapter tests
        run: |
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-aimuse \
            --only firestore,storage \
            "npm --prefix web run test:rules && cd functions && python -m pytest -q"
      - name: End-to-end (sign in, make a song, play, rate)
        env:
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
        run: mkdir -p "$SHOTS_DIR" && ./scripts/e2e.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 7
          if-no-files-found: ignore
